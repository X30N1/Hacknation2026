# Skopiuj do config.toml (plik jest w .gitignore) i uzupełnij.
# Brak config.toml lub pusty api_key dla DeepSeeka = tryb echo (do testów).

[llm]
# DeepSeek (API zgodne z OpenAI) lub lokalny serwer, np. Ollama: "http://localhost:11434/v1"
base_url = "https://api.deepseek.com"
api_key = ""
model = "deepseek-chat"
# limit czasu zapytania do LLM w sekundach
timeout = 120

[llm.limity]
# Ile tekstu (w znakach) trafia do modelu. Większe wartości = więcej kontekstu, ale wolniej
# i drożej; lokalny model może mieć mniejsze okno kontekstu.
przedmiot_max = 160            # propozycja „przedmiotu” w formularzu wniosku
wniosek_analiza = 6000         # wniosek -> wnioskodawca i przedmiot
wniosek_wydzialy = 4000        # wniosek -> sugerowane wydziały
anonimizacja_fragment = 6000   # tekst w jednym zapytaniu anonimizacji
anonimizacja_fragmenty = 10    # maks. zapytań na dokument (dalej tylko wzorce)
projekt_material = 6000        # jeden materiał (wniosek, odpowiedź wydziału) w projekcie odpowiedzi
projekt_wzor = 2500            # odpowiedź archiwalna użyta jako wzór stylu
uzasadnienie_max = 300         # uzasadnienie sugerowanego wydziału (odpowiedź modelu)

[llm.temperatury]
# 0 = odpowiedzi powtarzalne (ekstrakcja, JSON); wyżej = swobodniejszy styl tekstu (maks. 2).
analiza = 0          # wnioskodawca i przedmiot z wniosku
wydzialy = 0         # sugerowane wydziały
anonimizacja = 0     # dane do zamazania
projekt = 0.2        # projekt odpowiedzi

[database]
# SQLite; ścieżka względna liczona od katalogu backend/
path = "data/app.db"

[pliki]
# wgrane dokumenty; ścieżka względna liczona od katalogu backend/
katalog = "data/pliki"
max_mb = 20

[ocr]
# Tesseract + pakiet językowy (Arch: tesseract-data-pol, Debian/Ubuntu: tesseract-ocr-pol).
# Bez pakietu skany PDF wracają z pustym tekstem do wpisania ręcznie.
jezyk = "pol"
dpi = 300
max_stron = 20
# PDF z mniejszą liczbą znaków w warstwie tekstowej jest traktowany jak skan
min_znakow_warstwy = 50

[anonimizacja]
# Propozycje danych do zamazania: wzorce (PESEL, NIP, e-mail…) zawsze, a przy llm = true
# także model z [llm] (imiona i nazwiska, dane wrażliwe). Tekst dokumentu trafia do modelu –
# na produkcji tylko model lokalny.
llm = true
