# Uruchomienie w urzędzie:  docker compose up --build   ->  http://localhost:8000
#
# OCR skanów: GLM-OCR w lokalnej Ollamie. Jednorazowo pobierz model (jedyny krok z internetem):
#   docker compose run --rm ollama-pobierz                         # domyślnie: glm-ocr
#
# Bez modelu językowego aplikacja działa lokalnie: kalendarz, archiwum (wyszukiwanie pełnotekstowe),
# wydziały ze słów kluczowych i archiwum, projekt pisma z szablonu, anonimizacja wzorcami.
#
# Z lokalnym modelem językowym (dane nie opuszczają serwera):
#   1. MODEL="glm-ocr qwen2.5:7b" docker compose run --rm ollama-pobierz
#   2. w backend/config.toml:   [llm] base_url = "http://ollama:11434/v1"  api_key = ""  model = "qwen2.5:7b"
#
# Sieci:
#   default – aplikacja i port 8000 dla urzędników,
#   llm     – sieć wewnętrzna (internal): tylko aplikacja <-> ollama. Ollama nie ma dostępu do internetu,
#             nie publikuje portów i nie widzi innych kontenerów.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - dane:/app/backend/data
      - ./backend/config.toml:/app/backend/config.toml:ro
    environment:
      APP_OCR_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
    networks:
      - default
      - llm
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      - modele:/root/.ollama
    networks:
      - llm
    restart: unless-stopped

  # Pobieranie modelu do wolumenu „modele” – osobny, jednorazowy kontener z dostępem do internetu,
  # bez dostępu do sieci llm (nie widzi aplikacji ani jej danych).
  ollama-pobierz:
    image: ollama/ollama:0.40.16
    profiles: ["model"]
    volumes:
      - modele:/root/.ollama
    networks:
      - default
    environment:
      MODEL: ${MODEL:-glm-ocr}           # kilka modeli: MODEL="SpeakLeash/bielik-1.5b-v3.0-instruct:Q8_0"
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; for m in $$MODEL; do ollama pull "$$m" || exit 1; done']

networks:
  default:
  llm:
    internal: true

volumes:
  dane:
  modele:
